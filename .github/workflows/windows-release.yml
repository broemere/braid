name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-release.yml

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content config.py -Raw
          if ($config -notmatch '(?m)^APP_VERSION\s*=\s*["'']([^"'']+)["'']') {
            throw "APP_VERSION was not found in config.py"
          }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Build and package Windows application
        run: python build.py

      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = "dist/BRAID_v${{ steps.version.outputs.value }}_win.zip"
          if (-not (Test-Path $archive)) {
            throw "Expected release archive was not created: $archive"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BRAID-v${{ steps.version.outputs.value }}-windows
          path: dist/BRAID_v${{ steps.version.outputs.value }}_win.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create release and upload Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          $archive = "dist/BRAID_v${version}_win.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release $tag points to $tagCommit, not this build commit $env:GITHUB_SHA. Bump the version instead of replacing the existing release asset."
            }
            gh release upload $tag $archive --clobber
          } else {
            gh release create $tag $archive `
              --target $env:GITHUB_SHA `
              --title "BRAID v$version" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish $archive to release $tag"
          }
